name: Supabase migrations

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Apply migrations locally
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Apply all migrations on a fresh local database
        run: supabase db start

  deploy:
    name: Push to production
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Check GitHub secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::Missing repository secrets SUPABASE_ACCESS_TOKEN, PRODUCTION_PROJECT_ID, and PRODUCTION_DB_PASSWORD (see README → Database migrations)."
              exit 1
            fi
            echo "::warning::Skipping db push. Add repository secrets SUPABASE_ACCESS_TOKEN, PRODUCTION_PROJECT_ID, and PRODUCTION_DB_PASSWORD (see README → Database migrations)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link project and push pending migrations
        if: steps.secrets.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
          supabase db push --yes
